services:
  - type: web
    name: freight-cost-modelling-mvp
    runtime: node
    region: frankfurt
    plan: starter
    autoDeployTrigger: commit
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freight-cost-modelling-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: SEED_TENANT_ID
        value: tenant_pantheras
      - key: SEED_TENANT_NAME
        value: Pantheras Global Limited
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Platform Admin
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  - name: freight-cost-modelling-db
    region: frankfurt
    plan: basic-256mb
    databaseName: freight_cost_modelling
    user: freight_cost_modelling
