name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate initial migration when absent
        run: |
          if [ ! -f prisma/migrations/202610050001_init/migration.sql ]; then
            mkdir -p prisma/migrations/202610050001_init
            npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/202610050001_init/migration.sql
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit release reproducibility artifacts
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json prisma/migrations; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add package-lock.json prisma/migrations
            git commit -m "chore: lock dependencies and commit initial migration"
            git push
          fi
